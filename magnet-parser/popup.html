<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MagnetParser</title>
    <link rel="stylesheet" type="text/css" href="popup.css">
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img src="icons/icon-48.png" alt="MagnetParser Logo" class="brand-icon">
        <h1 class="brand-title">MagnetParser</h1>
      </div>
      <span id="badgeCount" class="badge">0 links</span>
    </header>

    <div class="actions">
      <button type="button" id="buttonExtract" class="btn btn-secondary" title="Re-scan the current tab">
        Extract
      </button>
      <button type="button" id="buttonCopyToClip" class="btn btn-primary" title="Copy extracted links to clipboard">
        Copy All
      </button>
      <button type="button" id="buttonClear" class="btn btn-secondary" title="Clear text area">
        Clear
      </button>
    </div>

    <div id="statusMessage" class="status-message" aria-live="polite"></div>

    <main class="content">
      <textarea
        id="magnetContainer"
        rows="14"
        spellcheck="false"
        placeholder="Extracted magnet links will appear here..."
      ></textarea>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
